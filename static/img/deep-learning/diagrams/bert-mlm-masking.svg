inant-baseline="central" font-weight="normal">1.5% of all tokens</text><rect x="60" y="370" width="1060" height="80" rx="10" fill="#f4f7fb" stroke="#c9d3df" stroke-width="1.5"/><text xml:space="preserve" style="white-space:pre" x="281.9" y="392.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="15.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">the label at every chosen position is the original token (hairy); unchosen positions get no loss</text><text xml:space="preserve" style="white-space:pre" x="217.1" y="418.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="15.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">the encoder can't tell which inputs are fake or which will be graded, so it must model every token from both sides</text></svg>