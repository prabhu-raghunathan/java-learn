<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 520" width="1340" height="520" role="img" xmlns:c2pa="http://c2pa.org/manifest"><title>Anatomy of the RAG prompt sent to FLAN-T5 (512-token limit)</title><rect x="1" y="1" width="1338" height="518" rx="14" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.5"/><rect x="90" y="120" width="760" height="36" rx="8" fill="#f7d0cf" stroke="#b5605c" stroke-width="1.6"/><text xml:space="preserve" style="white-space:pre" x="106.0" y="140.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="15.0" fill="#1f1f1f" dominant-baseline="central" font-weight="bold">instruction</text><text xml:space="preserve" style="white-space:pre" x="250.0" y="140.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">use only the context; otherwise say the document does not contain it</text><text xml:space="preserve" style="white-space:pre" x="781.6" y="140.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">33 tokens</text><rect x="90" y="164" width="760" height="36" rx="8" fill="#fbe9a6" stroke="#9c8526" stroke-width="1.6"/><text xml:space="preserve" style="white-space:pre" x="106.0" y="184.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="15.0" fill="#1f1f1f" dominant-baseline="central" font-weight="bold">question</text><text xml:space="preserve" style="white-space:pre" x="250.0" y="184.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">Question: What is next sentence prediction and why is it used?</text><text xml:space="preserve" style="white-space:pre" x="781.6" y="184.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">13 tokens</text><rect x="90" y="208" width="760" height="199.10000000000002" rx="8" fill="#e2f0d5" stroke="#7fae5b" stroke-width="1.6"/><text xml:space="preserve" style="white-space:pre" x="106.0" y="234.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="15.0" fill="#1f1f1f" dominant-baseline="central" font-weight="bold">context</text><text xml:space="preserve" style="white-space:pre" x="250.0" y="234.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">Context: best sentences from the top 5 chunks, in reading order</text><text xml:space="preserve" style="white-space:pre" x="752.4" y="234.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">3 + 359 tokens</text><rect x="90" y="415.1" width="760" height="36" rx="8" fill="#e3e3e3" stroke="#9a9a9a" stroke-width="1.6"/><text xml:space="preserve" style="white-space:pre" x="106.0" y="435.1" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="15.0" fill="#1f1f1f" dominant-baseline="central" font-weight="bold">answer cue</text><text xml:space="preserve" style="white-space:pre" x="250.0" y="435.1" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">Answer:</text><text xml:space="preserve" style="white-space:pre" x="788.9" y="435.1" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">2 tokens</text><text xml:space="preserve" style="white-space:pre" x="252.6" y="481.1" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">total 410 tokens for this question; anything past 512 would be cut off silently</text><rect x="930" y="120" width="350" height="300" rx="12" fill="#f4f7fb" stroke="#c9d3df" stroke-width="1.4"/><text xml:space="preserve" style="white-space:pre" x="1025.4" y="150.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="15.0" fill="#1f1f1f" dominant-baseline="central" font-weight="bold">kept out of the prompt</text><text xml:space="preserve" style="white-space:pre" x="960.0" y="190.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">• page numbers</text><text xml:space="preserve" style="white-space:pre" x="960.0" y="224.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">• chunk ids</text><text xml:space="preserve" style="white-space:pre" x="960.0" y="258.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">• retrieval scores</text><text xml:space="preserve" style="white-space:pre" x="960.0" y="292.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">• source headers like [Source 1 | Page 3]</text><text xml:space="preserve" style="white-space:pre" x="997.0" y="340.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">shown to the user next to the answer;</text><text xml:space="preserve" style="white-space:pre" x="984.3" y="362.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">in the prompt, a small model copied them:</text><text xml:space="preserve" style="white-space:pre" x="979.8" y="384.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#d23c3c" dominant-baseline="central" font-weight="normal">answer = "[Source 1 | Page 3 | Chunk 6 ...]"</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>