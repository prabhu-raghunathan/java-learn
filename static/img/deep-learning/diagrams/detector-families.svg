<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 600" width="1340" height="600" role="img" xmlns:c2pa="http://c2pa.org/manifest"><title>Three families of object detectors</title><rect x="1" y="1" width="1338" height="598" rx="14" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.5"/><rect x="40" y="78" width="1260" height="128" rx="12" fill="#f4f7fb" stroke="#c9d3df" stroke-width="1.3"/><text xml:space="preserve" style="white-space:pre" x="60.0" y="102.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="16.0" fill="#1f1f1f" dominant-baseline="central" font-weight="bold">Two-stage (Faster R-CNN)</text><text xml:space="preserve" style="white-space:pre" x="967.1" y="102.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">propose, then classify each proposal: accurate, slower</text><rect x="45" y="130" width="210" height="44" rx="6" fill="#a8cbee" stroke="#3b78bd" stroke-width="1.6"/><text xml:space="preserve" style="white-space:pre" x="105.9" y="152.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">CNN backbone</text><path d="M255.0,152.0 L288.6,152.0" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="295.0,152.0 287.0,156.4 287.0,147.6" fill="#1f1f1f"/><rect x="295" y="130" width="210" height="44" rx="6" fill="#fbe9a6" stroke="#9c8526" stroke-width="1.6"/><text xml:space="preserve" style="white-space:pre" x="351.9" y="152.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">region proposals</text><path d="M505.0,152.0 L538.6,152.0" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="545.0,152.0 537.0,156.4 537.0,147.6" fill="#1f1f1f"/><rect x="545" y="130" width="210" height="44" rx="6" fill="#fbe9a6" stroke="#9c8526" stroke-width="1.6"/><text xml:space="preserve" style="white-space:pre" x="617.1" y="152.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">RoI pooling</text><path d="M755.0,152.0 L788.6,152.0" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="795.0,152.0 787.0,156.4 787.0,147.6" fill="#1f1f1f"/><rect x="795" y="130" width="210" height="44" rx="6" fill="#fbe9a6" stroke="#9c8526" stroke-width="1.6"/><text xml:space="preserve" style="white-space:pre" x="851.0" y="152.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">class + box head</text><path d="M1005.0,152.0 L1038.6,152.0" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1045.0,152.0 1037.0,156.4 1037.0,147.6" fill="#1f1f1f"/><rect x="1045" y="130" width="210" height="44" rx="6" fill="#e3e3e3" stroke="#9a9a9a" stroke-width="1.6"/><text xml:space="preserve" style="white-space:pre" x="1135.6" y="152.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">NMS</text><rect x="40" y="238" width="1260" height="128" rx="12" fill="#f4f7fb" stroke="#c9d3df" stroke-width="1.3"/><text xml:space="preserve" style="white-space:pre" x="60.0" y="262.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="16.0" fill="#1f1f1f" dominant-baseline="central" font-weight="bold">One-stage (YOLO, SSD)</text><text xml:space="preserve" style="white-space:pre" x="970.7" y="262.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">predict everywhere in one pass: fast, many duplicates</text><rect x="45" y="290" width="210" height="44" rx="6" fill="#a8cbee" stroke="#3b78bd" stroke-width="1.6"/><text xml:space="preserve" style="white-space:pre" x="105.9" y="312.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">CNN backbone</text><path d="M255.0,312.0 L288.6,312.0" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="295.0,312.0 287.0,316.4 287.0,307.6" fill="#1f1f1f"/><rect x="295" y="290" width="210" height="44" rx="6" fill="#fbe9a6" stroke="#9c8526" stroke-width="1.6"/><text xml:space="preserve" style="white-space:pre" x="337.5" y="312.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">dense grid of anchors</text><path d="M505.0,312.0 L538.6,312.0" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="545.0,312.0 537.0,316.4 537.0,307.6" fill="#1f1f1f"/><rect x="545" y="290" width="210" height="44" rx="6" fill="#fbe9a6" stroke="#9c8526" stroke-width="1.6"/><text xml:space="preserve" style="white-space:pre" x="584.4" y="312.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">class + box per anchor</text><path d="M755.0,312.0 L788.6,312.0" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="795.0,312.0 787.0,316.4 787.0,307.6" fill="#1f1f1f"/><rect x="795" y="290" width="210" height="44" rx="6" fill="#e3e3e3" stroke="#9a9a9a" stroke-width="1.6"/><text xml:space="preserve" style="white-space:pre" x="855.6" y="312.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">score threshold</text><path d="M1005.0,312.0 L1038.6,312.0" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1045.0,312.0 1037.0,316.4 1037.0,307.6" fill="#1f1f1f"/><rect x="1045" y="290" width="210" height="44" rx="6" fill="#e3e3e3" stroke="#9a9a9a" stroke-width="1.6"/><text xml:space="preserve" style="white-space:pre" x="1135.6" y="312.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">NMS</text><rect x="40" y="398" width="1260" height="128" rx="12" fill="#f4f7fb" stroke="#c9d3df" stroke-width="1.3"/><text xml:space="preserve" style="white-space:pre" x="60.0" y="422.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="16.0" fill="#1f1f1f" dominant-baseline="central" font-weight="bold">Set prediction (DETR)</text><text xml:space="preserve" style="white-space:pre" x="909.3" y="422.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">each query claims one object; matching loss removes duplicates</text><rect x="45" y="450" width="210" height="44" rx="6" fill="#a8cbee" stroke="#3b78bd" stroke-width="1.6"/><text xml:space="preserve" style="white-space:pre" x="105.9" y="472.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">CNN backbone</text><path d="M255.0,472.0 L288.6,472.0" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="295.0,472.0 287.0,476.4 287.0,467.6" fill="#1f1f1f"/><rect x="295" y="450" width="210" height="44" rx="6" fill="#fbe9a6" stroke="#9c8526" stroke-width="1.6"/><text xml:space="preserve" style="white-space:pre" x="339.6" y="472.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">Transformer encoder</text><path d="M505.0,472.0 L538.6,472.0" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="545.0,472.0 537.0,476.4 537.0,467.6" fill="#1f1f1f"/><rect x="545" y="450" width="210" height="44" rx="6" fill="#fbe9a6" stroke="#9c8526" stroke-width="1.6"/><text xml:space="preserve" style="white-space:pre" x="569.8" y="472.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">decoder: 100 object queries</text><path d="M755.0,472.0 L788.6,472.0" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="795.0,472.0 787.0,476.4 787.0,467.6" fill="#1f1f1f"/><rect x="795" y="450" width="210" height="44" rx="6" fill="#fbe9a6" stroke="#9c8526" stroke-width="1.6"/><text xml:space="preserve" style="white-space:pre" x="812.9" y="472.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">100 x (class or no-object, box)</text><path d="M1005.0,472.0 L1038.6,472.0" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1045.0,472.0 1037.0,476.4 1037.0,467.6" fill="#1f1f1f"/><rect x="1045" y="450" width="210" height="44" rx="6" fill="#e3e3e3" stroke="#9a9a9a" stroke-width="1.6"/><text xml:space="preserve" style="white-space:pre" x="1103.0" y="472.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">no NMS needed</text><text xml:space="preserve" style="white-space:pre" x="403.4" y="575.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">all three end with a list of (class, score, box); detections below a score threshold are dropped</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>