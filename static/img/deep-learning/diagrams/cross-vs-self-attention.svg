central" font-weight="normal">movie</text><circle cx="890" cy="260" r="34" fill="#a8cbee" stroke="#3b78bd" stroke-width="2.4"/><text xml:space="preserve" style="white-space:pre" x="879.3" y="260.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="12.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">was</text><circle cx="985" cy="260" r="34" fill="#a8cbee" stroke="#3b78bd" stroke-width="2.4"/><text xml:space="preserve" style="white-space:pre" x="976.7" y="260.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="12.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">not</text><circle cx="1080" cy="260" r="34" fill="#a8cbee" stroke="#3b78bd" stroke-width="2.4"/><text xml:space="preserve" style="white-space:pre" x="1066.7" y="260.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="12.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">good</text><path d="M1080,226 Q890.0,-23.00000000000003 700,226" fill="none" stroke="#d23c3c" stroke-width="2.4" opacity="0.85"/><path d="M1080,226 Q937.5,29.25 795,226" fill="none" stroke="#d23c3c" stroke-width="2.4" opacity="0.85"/><path d="M1080,226 Q985.0,81.49999999999999 890,226" fill="none" stroke="#d23c3c" stroke-width="2.4" opacity="0.85"/><path d="M1080,226 Q1032.5,133.75 985,226" fill="none" stroke="#d23c3c" stroke-width="2.4" opacity="0.85"/><path d="M1058,226 C1040,150 1120,150 1102,226" fill="none" stroke="#d23c3c" stroke-width="2.6"/><text xml:space="preserve" style="white-space:pre" x="762.8" y="330.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">“good” scores every token, itself included</text><text xml:space="preserve" style="white-space:pre" x="729.7" y="356.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">(every other toke