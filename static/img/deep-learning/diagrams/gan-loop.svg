<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 560" width="1340" height="560" role="img" xmlns:c2pa="http://c2pa.org/manifest"><title>A GAN: a generator and a discriminator trained against each other</title><rect x="1" y="1" width="1338" height="558" rx="14" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.5"/><circle cx="110" cy="250" r="30" fill="#a8cbee" stroke="#3b78bd" stroke-width="2.4"/><text xml:space="preserve" style="white-space:pre" x="105.0" y="250.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="20.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">z</text><text xml:space="preserve" style="white-space:pre" x="70.6" y="300.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">random noise</text><rect x="230.0" y="220.0" width="200" height="60" rx="4" fill="#fbe9a6" stroke="#9c8526" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="285.5" y="250.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="16.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">Generator G</text><circle cx="560" cy="250" r="34" fill="#dcb6ee" stroke="#8a4fae" stroke-width="2.4"/><text xml:space="preserve" style="white-space:pre" x="546.8" y="250.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">fake</text><text xml:space="preserve" style="white-space:pre" x="547.4" y="302.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">G(z)</text><circle cx="560" cy="110" r="34" fill="#a8cbee" stroke="#3b78bd" stroke-width="2.4"/><text xml:space="preserve" style="white-space:pre" x="548.3" y="110.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">real</text><text xml:space="preserve" style="white-space:pre" x="516.6" y="62.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">x from the data</text><rect x="705.0" y="150.0" width="230" height="60" rx="4" fill="#fbe9a6" stroke="#9c8526" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="765.3" y="180.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="16.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">Discriminator D</text><circle cx="1060" cy="180" r="24" fill="#f7d0cf" stroke="#b5605c" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="1055.0" y="180.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="18.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">p</text><text xml:space="preserve" style="white-space:pre" x="1021.0" y="225.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="12.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">probability real</text><path d="M140.0,250.0 L223.6,250.0" fill="none" stroke="#1f1f1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="230.0,250.0 222.0,254.4 222.0,245.6" fill="#1f1f1f"/><path d="M430.0,250.0 L519.6,250.0" fill="none" stroke="#1f1f1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="526.0,250.0 518.0,254.4 518.0,245.6" fill="#1f1f1f"/><path d="M594.0,110.0 L668.0,110.0 Q680.0,110.0 680.0,122.0 L680.0,155.7 Q680.0,165.0 689.3,165.0 L698.6,165.0" fill="none" stroke="#1f1f1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="705.0,165.0 697.0,169.4 697.0,160.6" fill="#1f1f1f"/><path d="M594.0,250.0 L668.0,250.0 Q680.0,250.0 680.0,238.0 L680.0,204.3 Q680.0,195.0 689.3,195.0 L698.6,195.0" fill="none" stroke="#1f1f1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="705.0,195.0 697.0,199.4 697.0,190.6" fill="#1f1f1f"/><path d="M935.0,180.0 L1029.6,180.0" fill="none" stroke="#1f1f1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1036.0,180.0 1028.0,184.4 1028.0,175.6" fill="#1f1f1f"/><rect x="380" y="330" width="620" height="150" rx="10" fill="#f4f7fb" stroke="#c9d3df" stroke-width="1.3"/><text xml:space="preserve" style="white-space:pre" x="533.2" y="360.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">D step: push D(real) up to 1 and D(fake) down to 0</text><text xml:space="preserve" style="white-space:pre" x="497.3" y="392.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#d23c3c" dominant-baseline="central" font-weight="normal">G step: push D(G(z)) up to 1 (fool D); only G's weights change</text><text xml:space="preserve" style="white-space:pre" x="490.0" y="428.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">balance: D(real) and D(fake) both near 0.5, D loss near 2 ln 2 = 1.386</text><text xml:space="preserve" style="white-space:pre" x="526.4" y="456.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">healthy run here at step 3000: 0.511, 0.457, D loss 1.343</text><path d="M1060.0,204.0 L1060.0,508.0 Q1060.0,520.0 1048.0,520.0 L342.0,520.0 Q330.0,520.0 330.0,508.0 L330.0,287.2" fill="none" stroke="#d23c3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7,5"/><polygon points="330.0,280.0 334.9,289.0 325.1,289.0" fill="#d23c3c"/><text xml:space="preserve" style="white-space:pre" x="466.4" y="545.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#d23c3c" dominant-baseline="central" font-weight="normal">the generator never sees real data; it learns only from the discriminator's gradient</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>