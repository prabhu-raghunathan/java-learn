amily="Helvetica, Arial, Liberation Sans, sans-serif" font-size="12.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">['learn', 'machine', 'learn', 'love']</text><path d="M784.0,140.0 L835.2,140.0" fill="none" stroke="#1f1f1f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="844.0,140.0 833.0,146.1 833.0,133.9" fill="#1f1f1f"/><circle cx="878" cy="140" r="34" fill="#dcb6ee" stroke="#8a4fae" stroke-width="2.4"/><text xml:space="preserve" style="white-space:pre" x="857.4" y="140.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">tokens</text><text xml:space="preserve" style="white-space:pre" x="299.9" y="290.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="15.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">each step shrinks the vocabulary and throws information away (e.g. 'not' is a stop word)</text></svg>