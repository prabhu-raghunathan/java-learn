<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330" width="1180" height="330" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Text preprocessing pipeline</title><rect x="1" y="1" width="1178" height="328" rx="14" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.5"/><circle cx="90" cy="140" r="34" fill="#a8cbee" stroke="#3b78bd" stroke-width="2.4"/><text xml:space="preserve" style="white-space:pre" x="77.1" y="140.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="16.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">text</text><text xml:space="preserve" style="white-space:pre" x="23.9" y="200.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">“I am learning machine</text><text xml:space="preserve" style="white-space:pre" x="28.2" y="218.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">learning and loving it”</text><path d="M124.0,140.0 L175.2,140.0" fill="none" stroke="#1f1f1f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="184.0,140.0 173.0,146.1 173.0,133.9" fill="#1f1f1f"/><rect x="184" y="110" width="160" height="60" rx="4" fill="#fbe9a6" stroke="#9c8526" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="223.8" y="128.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="15.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">lowercase +</text><text xml:space="preserve" style="white-space:pre" x="236.1" y="150.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="15.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">tokenize</text><text xml:space="preserve" style="white-space:pre" x="198.5" y="210.0" font-family="Helvetica, Arial, Liberation Sa