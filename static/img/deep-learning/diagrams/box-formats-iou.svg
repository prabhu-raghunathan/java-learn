<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 560" width="1340" height="560" role="img" xmlns:c2pa="http://c2pa.org/manifest"><title>Two ways to write the same box, and how IoU compares two boxes</title><rect x="1" y="1" width="1338" height="558" rx="14" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.5"/><rect x="80" y="90" width="372.0" height="248.0" rx="4" fill="#f4f7fb" stroke="#c9d3df" stroke-width="1.4"/><text xml:space="preserve" style="white-space:pre" x="112.5" y="76.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">image 600 x 400 pixels (origin top-left, y grows down)</text><rect x="186.888" y="100.974" width="147.808" height="167.02800000000002" rx="2" fill="none" stroke="#3b78bd" stroke-width="3"/><circle cx="186.888" cy="100.974" r="6" fill="#8a4fae"/><circle cx="334.696" cy="268.002" r="6" fill="#8a4fae"/><circle cx="260.79200000000003" cy="184.488" r="6" fill="#d23c3c"/><text xml:space="preserve" style="white-space:pre" x="123.6" y="127.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="12.0" fill="#8a4fae" dominant-baseline="central" font-weight="normal">(x</text><text xml:space="preserve" style="white-space:pre" x="134.3" y="130.8" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="8.6" fill="#8a4fae" dominant-baseline="central" font-weight="normal">min</text><text xml:space="preserve" style="white-space:pre" x="148.9" y="127.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="12.0" fill="#8a4fae" dominant-baseline="central" font-weight="normal">, y</text><text xml:space="preserve" style="white-space:pre" x="162.3" y="130.8" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="8.6" fill="#8a4fae" dominant-baseline="central" font-weight="normal">min</text><text xml:space="preserve" style="white-space:pre" x="176.9" y="127.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="12.0" fill="#8a4fae" dominant-baseline="central" font-weight="normal">)</text><text xml:space="preserve" style="white-space:pre" x="342.7" y="272.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="12.0" fill="#8a4fae" dominant-baseline="central" font-weight="normal">(x</text><text xml:space="preserve" style="white-space:pre" x="353.4" y="275.8" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="8.6" fill="#8a4fae" dominant-baseline="central" font-weight="normal">max</text><text xml:space="preserve" style="white-space:pre" x="370.4" y="272.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="12.0" fill="#8a4fae" dominant-baseline="central" font-weight="normal">, y</text><text xml:space="preserve" style="white-space:pre" x="383.8" y="275.8" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="8.6" fill="#8a4fae" dominant-baseline="central" font-weight="normal">max</text><text xml:space="preserve" style="white-space:pre" x="400.7" y="272.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="12.0" fill="#8a4fae" dominant-baseline="central" font-weight="normal">)</text><text xml:space="preserve" style="white-space:pre" x="241.5" y="206.5" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="12.0" fill="#d23c3c" dominant-baseline="central" font-weight="normal">(cx, cy)</text><text xml:space="preserve" style="white-space:pre" x="80.0" y="378.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">cup, corners xyxy:  172.4, 17.7, 410.8, 287.1</text><text xml:space="preserve" style="white-space:pre" x="80.0" y="404.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">cup, centre cxcywh:  291.6, 152.4, 238.4, 269.4</text><text xml:space="preserve" style="white-space:pre" x="80.0" y="430.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">normalised by 600 x 400:  0.486, 0.381, 0.397, 0.674  (what DETR outputs)</text><text xml:space="preserve" style="white-space:pre" x="924.2" y="100.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="16.0" fill="#1f1f1f" dominant-baseline="central" font-weight="bold">IoU = area of overlap / area of union</text><rect x="820" y="140" width="176" height="176" rx="2" fill="#a8cbee" stroke="#3b78bd" stroke-width="2"/><rect x="908" y="228" width="176" height="176" rx="2" fill="#dcb6ee" stroke="#8a4fae" stroke-width="2"/><rect x="908" y="228" width="88" height="88" rx="1" fill="#e2f0d5" stroke="#7fae5b" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="947.6" y="272.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="16.0" fill="#1f1f1f" dominant-baseline="central" font-weight="bold">4</text><text xml:space="preserve" style="white-space:pre" x="858.2" y="184.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="16.0" fill="#1f1f1f" dominant-baseline="central" font-weight="bold">A</text><text xml:space="preserve" style="white-space:pre" x="1034.2" y="360.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="16.0" fill="#1f1f1f" dominant-baseline="central" font-weight="bold">B</text><text xml:space="preserve" style="white-space:pre" x="1114.0" y="170.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">A = (0,0,4,4), B = (2,2,6,6)</text><text xml:space="preserve" style="white-space:pre" x="1114.0" y="200.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">overlap = 2 x 2 = 4</text><text xml:space="preserve" style="white-space:pre" x="1114.0" y="230.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">union = 16 + 16 - 4 = 28</text><text xml:space="preserve" style="white-space:pre" x="1114.0" y="260.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#1f1f1f" dominant-baseline="central" font-weight="bold">IoU = 4 / 28 = 0.143</text><text xml:space="preserve" style="white-space:pre" x="786.1" y="470.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="13.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">IoU 1 = identical boxes, 0 = no overlap; a detection usually counts as correct at IoU 0.5 or more</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>