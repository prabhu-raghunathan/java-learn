<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 380" width="1180" height="380" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>The PyTorch training loop</title><rect x="1" y="1" width="1178" height="378" rx="14" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.5"/><rect x="10.0" y="135.0" width="200" height="50" rx="4" fill="#fbe9a6" stroke="#9c8526" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="60.4" y="160.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="16.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal"><tspan font-family="DejaVu Sans, Apple Symbols, Segoe UI Symbol, Cambria Math, sans-serif">①</tspan> zero_grad()</text><text xml:space="preserve" style="white-space:pre" x="65.6" y="205.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">clear old .grad</text><rect x="230.0" y="135.0" width="200" height="50" rx="4" fill="#fbe9a6" stroke="#9c8526" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="289.3" y="160.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="16.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal"><tspan font-family="DejaVu Sans, Apple Symbols, Segoe UI Symbol, Cambria Math, sans-serif">②</tspan> model(X)</text><text xml:space="preserve" style="white-space:pre" x="289.9" y="205.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">forward pass</text><rect x="460.0" y="135.0" width="200" height="50" rx="4" fill="#fbe9a6" stroke="#9c8526" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="489.5" y="160.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="16.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal"><tspan font-family="DejaVu Sans, Apple Symbols, Segoe UI Symbol, Cambria Math, sans-serif">③</tspan> criterion(preds, y)</text><text xml:space="preserve" style="white-space:pre" x="506.3" y="205.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">loss: one number</text><rect x="690.0" y="135.0" width="200" height="50" rx="4" fill="#fbe9a6" stroke="#9c8526" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="725.8" y="160.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="16.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal"><tspan font-family="DejaVu Sans, Apple Symbols, Segoe UI Symbol, Cambria Math, sans-serif">④</tspan> loss.backward()</text><text xml:space="preserve" style="white-space:pre" x="746.4" y="205.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">fill every .grad</text><rect x="920.0" y="135.0" width="200" height="50" rx="4" fill="#fbe9a6" stroke="#9c8526" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="957.1" y="160.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="16.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal"><tspan font-family="DejaVu Sans, Apple Symbols, Segoe UI Symbol, Cambria Math, sans-serif">⑤</tspan> optimizer.step()</text><text xml:space="preserve" style="white-space:pre" x="978.4" y="205.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">θ ← θ − η <tspan font-family="DejaVu Sans, Apple Symbols, Segoe UI Symbol, Cambria Math, sans-serif">∇</tspan>L</text><path d="M210.0,160.0 L221.2,160.0" fill="none" stroke="#1f1f1f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="230.0,160.0 219.0,166.1 219.0,153.9" fill="#1f1f1f"/><path d="M430.0,160.0 L451.2,160.0" fill="none" stroke="#1f1f1f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="460.0,160.0 449.0,166.1 449.0,153.9" fill="#1f1f1f"/><path d="M660.0,160.0 L681.2,160.0" fill="none" stroke="#1f1f1f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="690.0,160.0 679.0,166.1 679.0,153.9" fill="#1f1f1f"/><path d="M890.0,160.0 L911.2,160.0" fill="none" stroke="#1f1f1f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="920.0,160.0 909.0,166.1 909.0,153.9" fill="#1f1f1f"/><path d="M1020.0,135.0 L1020.0,98.0 Q1020.0,80.0 1002.0,80.0 L128.0,80.0 Q110.0,80.0 110.0,98.0 L110.0,126.2" fill="none" stroke="#1f1f1f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="110.0,135.0 104.0,124.0 116.0,124.0" fill="#1f1f1f"/><text xml:space="preserve" style="white-space:pre" x="530.4" y="60.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="15.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">next batch</text><circle cx="400" cy="290" r="22" fill="#a8cbee" stroke="#3b78bd" stroke-width="2.4"/><text xml:space="preserve" style="white-space:pre" x="392.7" y="290.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="22.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">X</text><path d="M400.0,268.0 L400.0,194.8" fill="none" stroke="#1f1f1f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="400.0,186.0 406.1,197.0 393.9,197.0" fill="#1f1f1f"/><circle cx="640" cy="290" r="22" fill="#a8cbee" stroke="#3b78bd" stroke-width="2.4"/><text xml:space="preserve" style="white-space:pre" x="634.5" y="290.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="22.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">y</text><path d="M640.0,268.0 L640.0,194.8" fill="none" stroke="#1f1f1f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="640.0,186.0 646.0,197.0 634.0,197.0" fill="#1f1f1f"/><text xml:space="preserve" style="white-space:pre" x="228.2" y="350.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="15.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">backward() ADDS into .grad, so zero_grad() must run once per update, never between backward() and step()</text></svg>