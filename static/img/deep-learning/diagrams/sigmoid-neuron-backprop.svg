 y="150.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="22.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">σ</text><path d="M500.0,150.0 L631.2,150.0" fill="none" stroke="#1f1f1f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="640.0,150.0 629.0,156.1 629.0,143.9" fill="#1f1f1f"/><text xml:space="preserve" style="white-space:pre" x="532.0" y="128.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="16.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">a = 0.6225</text><ellipse cx="700" cy="150" rx="52.0" ry="24" fill="#f7d0cf" stroke="#b5605c" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="676.0" y="150.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="15.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">(a − y)²</text><path d="M752.0,150.0 L841.2,150.0" fill="none" stroke="#1f1f1f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="850.0,150.0 839.0,156.1 839.0,143.9" fill="#1f1f1f"/><circle cx="890" cy="150" r="30" fill="#dcb6ee" stroke="#8a4fae" stroke-width="2.4"/><text xml:space="preserve" style="white-space:pre" x="883.9" y="150.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="22.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">L</text><text xml:space="preserve" style="white-space:pre" x="867.1" y="200.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="15.0" fill="#1f1f1f" dominant-baseline="central" font-weight="normal">0.1425</text><text xml:space="preserve" style="white-space:pre" x="684.6" y="200.0" font-family="Helvetica, Arial, Liberation Sans, sans-serif" font-size="14.0" fill="#8a8a8a" dominant-baseline="central" font-weight="normal">y = 1</text><path d="M860.0,250.0 L748.8,250.0" fill="none" stroke="#d23c3c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" 